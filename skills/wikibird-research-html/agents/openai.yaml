interface:
  display_name: "Wikibird Research HTML"
  short_description: "Current research to Korean wiki HTML"
  brand_color: "#B7EAD8"
  default_prompt: "Use $wikibird-research-html to research this topic and build a Korean wiki-style HTML page. On first activation, ask for default research depth: 하 quick, 중 normal, 상 deep. While Wikibird is active, end conversational replies with 짹."

policy:
  allow_implicit_invocation: true
