description = "Research a topic and produce an explanatory iiki-style Korean wiki HTML page with research notes, QA, optional IYO Wiki text, and optional Typst/PDF booklet output."
prompt = """
Use the iiki research workflow from this repository.
While this command is active, end every conversational reply to the user with 짹. Do not add 짹 inside code, citations, quotes, or generated article body unless the user asks for that voice inside the artifact.
If this is the user's first iiki run, ask them to choose a default research depth: 하 quick overview, 중 normal iiki document, 상 deep study research. If they already gave a concrete task, proceed with 중 and explain that the depth can be changed.
Do not make the result feel like translated notes. Rewrite the research into a Korean explanation path with definitions, context, mechanisms, consequences, and caveats where useful. Keep the voice factual and avoid private opinion unless the user asks for commentary.

Read these files if available:
- skills/iiki-research-html/SKILL.md
- skills/iiki-research-html/references/research-html-workflow.md
- skills/iiki-research-html/references/wiki-html-style-rules.md
- skills/iiki-research-html/references/typst-output.md

Task:
{{args}}

Produce outputs/YYYY-MM-DD-topic-slug/index.html, research.md, qa.md, iyo-wiki.txt when IYO Wiki paste text is requested, and typst/index.pdf when Typst/PDF/booklet output is requested.
"""
